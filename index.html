<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEIC to PNG (GPS)</title>
  <!-- HEIC変換とExif解析ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <!-- 📦 ZIP生成ライブラリを追加 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; line-height: 1.6; max-width: 600px; margin: auto; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .btn { display: inline-block; padding: 14px 24px; background: #007aff; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; box-sizing: border-box; width: 100%; margin: 15px 0; }
    .btn-success { background: #28a745; font-size: 1.1em; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    .log-item { font-size: 0.9em; color: #555; padding: 4px 0; border-bottom: 1px dashed #eee; }
  </style>
</head>
<body>
  <h2>HEIF → PNG (GPS付き)</h2>
  <p>100枚でもOK！複数変換後にまとめてZIPで保存できる変換器</p>
  
  <input type="file" id="fileInput" accept="image/heic,image/heif" multiple style="font-size: 16px; padding: 10px 0;">
  
  <div id="status"></div>
  
  <!-- ここにZIPダウンロードボタンが出現する -->
  <div id="zipArea"></div>
  
  <div class="card" style="margin-top: 20px;">
    <strong>処理ログ</strong>
    <div id="output" style="margin-top: 10px;"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const outputDiv = document.getElementById('output');
    const zipArea = document.getElementById('zipArea');

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      // 表示の初期化
      outputDiv.innerHTML = '';
      zipArea.innerHTML = '';
      statusDiv.innerText = `${files.length}件の処理を開始...`;
      
      // 📦 ZIPオブジェクトの作成
      const zip = new JSZip();
      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `処理中 (${i + 1}/${files.length}): ${file.name}`;

        try {
          // 1. ExifからGPS座標を抽出
          let coordStr = "_no_gps";
          const exifData = await exifr.gps(file);
          if (exifData && exifData.latitude && exifData.longitude) {
            coordStr = `_${exifData.latitude.toFixed(6)},${exifData.longitude.toFixed(6)}`;
          }

          // 2. HEICをPNG Blobへ変換
          const pngBlob = await heic2any({ blob: file, toType: "image/png" });
          const blobToUse = Array.isArray(pngBlob) ? pngBlob[0] : pngBlob;

          // 3. ファイル名生成
          const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          const outName = `${baseName}${coordStr}.png`;
          
          // 📦 変換した画像をZIP内に放り込む
          zip.file(outName, blobToUse);
          successCount++;

          // ログに追記
          const logItem = document.createElement('div');
          logItem.className = 'log-item';
          logItem.innerHTML = `✅ 変換OK: ${outName}`;
          outputDiv.appendChild(logItem);

        } catch (err) {
          console.error(err);
          const errItem = document.createElement('div');
          errItem.className = 'log-item';
          errItem.innerHTML = `❌ エラー: ${file.name}`;
          errItem.style.color = "red";
          outputDiv.appendChild(errItem);
        }
      }
      
      // すべての処理が終わったらZIPを生成してボタンを出す
      if (successCount > 0) {
        statusDiv.innerText = "変換完了！ZIPファイルを生成中...";
        
        try {
          const zipBlob = await zip.generateAsync({ type: "blob" });
          const zipUrl = URL.createObjectURL(zipBlob);
          
          // ドデカいダウンロードボタンを表示
          zipArea.innerHTML = `
            <a class="btn btn-success" href="${zipUrl}" download="converted_images.zip">
              📦 ${successCount}枚をまとめてZIPで保存！
            </a>
          `;
          statusDiv.innerText = "すべての処理が完了したぜ！下の緑のボタンから保存してくれ！";
        } catch (err) {
          statusDiv.innerText = "ZIP生成中にエラーが発生しました。";
        }
      } else {
        statusDiv.innerText = "変換に成功したファイルがありませんでした。";
      }
    });
  </script>
</body>
</html>
