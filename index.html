<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEIC to PNG (GPS)</title>
  <!-- HEIC変換ライブラリとExif解析ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; line-height: 1.6; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .btn { display: inline-block; padding: 8px 16px; background: #007aff; color: #fff; text-decoration: none; border-radius: 6px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>HEIF → PNG (GPS付き)</h2>
  <input type="file" id="fileInput" accept="image/heic,image/heif" multiple>
  <div id="status" style="margin-top: 10px; color: #666;"></div>
  <div id="output"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const outputDiv = document.getElementById('output');

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      outputDiv.innerHTML = '';
      statusDiv.innerText = `${files.length}件の処理を開始...`;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `処理中 (${i + 1}/${files.length}): ${file.name}`;

        try {
          // 1. ExifからGPS座標を抽出
          let coordStr = "_no_gps";
          const exifData = await exifr.gps(file);
          if (exifData && exifData.latitude && exifData.longitude) {
            coordStr = `_${exifData.latitude.toFixed(6)},${exifData.longitude.toFixed(6)}`;
          }

          // 2. HEICをPNG Blobへ変換
          const pngBlob = await heic2any({ blob: file, toType: "image/png" });
          const blobToUse = Array.isArray(pngBlob) ? pngBlob[0] : pngBlob;

          // 3. ダウンロードリンク生成
          const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          const outName = `${baseName}${coordStr}.png`;
          const url = URL.createObjectURL(blobToUse);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div><strong>${outName}</strong></div>
            <a class="btn" href="${url}" download="${outName}">ダウンロード</a>
          `;
          outputDiv.appendChild(card);
        } catch (err) {
          console.error(err);
          const errDiv = document.createElement('div');
          errDiv.innerText = `エラー: ${file.name}`;
          errDiv.style.color = "red";
          outputDiv.appendChild(errDiv);
        }
      }
      statusDiv.innerText = "すべての処理が完了したぜ！";
    });
  </script>
</body>
</html>
